              - -update_transporter_at
              - -transporter_id
              - -next_transporter_id
              - -next_coupon_id
              - -next_billing
              - -interval
              - -interval_count
          example: "-created_at"
      responses:
        200:
          description: Liste de abonnements récupérée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionEntity"
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
