      tags:
        - transactions
      security:
        - bearerAuth: [ ]
      parameters:
        - name: transaction_id
          in: path
          required: true
          description: L'identifiant de la transaction à récupérer (champ `transaction_id`).
          schema:
            type: string
      responses:
        200:
          description: Réponse réussie
          content:
            application/json:
              schema:
                type: object
