openapi: 3.1.0
servers:
  - url: https://{environment}.ciklik.co/api/v3
    description: Serveur API
    variables:
      environment:
        default: app
        enum:
          - app # URL de Production
          - demonstration # URL de Test/Démonstration
info:
  title: Ciklik API
  version: 1.0.0
  description: "# Bienvenue sur l'API Ciklik. Vous pouvez l'utiliser pour accéder aux ressources de votre compte, ou lancer des actions de base.\n## API Endpoints\nThe base endpoint is https://{environment}.ciklik.co/api/v3\n## Authentification\nL'API s'authentifie par un jeton d'API Ciklik (jeton opaque, ce n'est pas un JWT) envoyé dans l'en-tête `Authorization: Bearer`.\n\nExemple :\n  ```curl\n  curl --location 'https://{environment}.ciklik.co/api/v3/whoiam' --header 'Authorization: Bearer <Ciklik Token>'\n  ```\n\nUne requête sans jeton ou avec un jeton invalide reçoit `401` ; un jeton valide qui n'a pas accès à la ressource reçoit `403`.\n## Request Limit\nLe nombre de requêtes est limité à 200 par minute, compté par adresse IP (toutes les requêtes émises depuis la même adresse IP partagent ce quota). Si la limite est atteinte, la réponse http sera `429 Too Many Requests`.\n## Filtres\nCertains endpoints de l'API prennent en charge le filtrage des résultats sur un ensemble spécifié de champs. Chaque endpoint qui prend en charge le filtrage énumérera les champs qui peuvent être filtrés. Plusieurs champs peuvent être combinés en utilisant un caractère esperluette &\n\nExemple: `/subscriptions?filter[activated]=1&filter[created_at_after]=2026-01-01&sort=-created_at`\n\nUn filtre ou un tri qui n'est pas dans la liste de l'endpoint est refusé avec une réponse `400 Bad Request` (les endpoints qui valident eux-mêmes le paramètre `sort` répondent `422` pour un tri hors liste). Une valeur de filtre au mauvais format peut être refusée en `422`.\n## Pagination\nLes listes de résultats de l'API sont paginées. La pagination est fixe : 20 éléments par page, quelle que soit la valeur d'un éventuel paramètre `per_page` (ignoré). Vous pouvez obtenir les différentes pages avec la query string `page`, default value `1`.\n\nLe nombre total d'éléments dans une liste est disponible dans le champ `meta.total`.\n\nExemple: `?page=2`\n"

tags:
  - name: tenant
    description: Opérations liées à l'entité "Website".
  - name: products
    description: Opérations liées aux produits
  - name: webhooks
    description: Opérations liées aux webhooks
  - name: subscriptions
    description: Opérations liées aux abonnements
  - name: deliveries
    description: Opérations liées aux bons de livraison
  - name: kpis
    description: Opérations liées aux indicateurs de performance
  - name: addresses
    description: Opérations liées aux adresses
  - name: customers
    description: Opérations liées aux comptes utilisateurs
  - name: transactions
    description: Opérations liées aux transactions
  - name: rebill-errors
    description: Opérations liées aux erreurs de rebill
  - name: orders
    description: Opérations liées aux commandes
paths:
  /whoiam:
    get:
      summary: Récupérer les données de l'entité "Website"
      description: Renvoie le site du jeton, enveloppé dans `data`. Le champ `metadata` contient toutes les clés de métadonnées du site, y compris celles qui n'ont pas été posées par l'API.
      tags:
        - tenant
      security:
        - bearerAuth: []
      responses:
        200:
          description: Réponse réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteEntity"
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        429:
          $ref: '#/components/responses/TooManyRequests'
    put:
      summary: Mettre à jour les métadonnées d'un site web (WebsiteEntity)
      description: Permet de mettre à jour les métadonnées d'un site web (WebsiteEntity) en modifiant ou ajoutant des clés/valeurs au champ "metadata". Les clés envoyées sont fusionnées avec les métadonnées existantes ; les clés absentes du corps sont conservées (elles ne sont pas effacées). La réponse renvoie le site complet, enveloppé dans `data`.
      tags:
        - tenant
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  additionalProperties:
                    type: [string, "null"]
                    maxLength: 5000
                  description: |
                    Métadonnées personnalisées. Les valeurs doivent être des chaînes de caractères (max 5000 caractères) ou null.
                    Seules les clés envoyées sont modifiées, les autres clés du site sont conservées.
                    Les clés commençant par "ciklik_encrypted_" seront automatiquement encryptées.
              example:
                metadata:
                  key1: "value1"
                  key2: "value2"
                  ciklik_encrypted_key2: "value-encrypted"
      responses:
        200:
          description: Succès - Les métadonnées ont été mises à jour avec succès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteEntity"
        422:
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        429:
          $ref: '#/components/responses/TooManyRequests'
  /installation:
    get:
      operationId: getInstallation
      summary: Récupérer l'état d'installation de l'espace
      description: |
        Route destinée au back-office du module PrestaShop : elle renvoie l'état d'installation de l'espace du jeton (espace de test ou de production, étapes franchies, ce qui reste à faire et adresse de la page de suivi d'installation).
        Les libellés sont traduits dans la langue de la requête. L'état est lu tel qu'il a été relevé lors des dernières vérifications : aucune vérification n'est lancée pendant la requête.
      tags:
        - tenant
      security:
        - bearerAuth: [ ]
      responses:
        200:
          description: Réponse réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InstallationState"
        401:
          description: Authentification requise (jeton absent ou invalide)
        403:
          description: Accès interdit
        429:
          $ref: '#/components/responses/TooManyRequests'
  /products:
    get:
      summary: Récupérer une liste de produits
      tags:
        - products
      security:
        - bearerAuth: [ ]
      parameters:
        - name: filter[id]
          in: query
          description: Filtrer par ID du produit
          schema:
            type: integer
          example: 1
        - name: filter[name]
          in: query
          description: Filtrer par nom du produit
          schema:
            type: string
          example: "Produit exemple"
        - name: filter[id_category]
          in: query
          description: Filtrer par ID de catégorie
          schema:
            type: integer
          example: 5
        - name: filter[quantity]
          in: query
          description: Filtrer par quantité
          schema:
            type: integer
          example: 10
        - name: filter[price]
          in: query
          description: Filtrer par prix
          schema:
            type: number
          example: 29.99
        - name: filter[active]
          in: query
          description: Filtrer par état d'activité
          schema:
            type: boolean
          example: true
        - name: filter[slug]
          in: query
          description: Filtrer par slug
          schema:
            type: string
          example: "produit-exemple"
        - name: filter[virtual_product]
          in: query
          description: Filtrer par produit virtuel (correspondance exacte)
          schema:
            type: boolean
        - name: filter[salable]
          in: query
          description: Filtrer par produit vendable
          schema:
            type: boolean
        - name: filter[gift_card]
          in: query
          description: Filtrer par carte cadeau
          schema:
            type: boolean
        - name: filter[gift_plan]
          in: query
          description: Filtrer par plan cadeau (UUID du plan, correspondance partielle)
          schema:
            type: string
        - name: filter[disable_seo]
          in: query
          description: Filtrer par désactivation SEO (correspondance exacte)
          schema:
            type: boolean
        - name: filter[ref]
          in: query
          description: Filtrer par référence
          schema:
            type: string
        - name: filter[composable]
          in: query
          description: Filtrer par composable
          schema:
            type: boolean
        - name: sort
          in: query
          description: "Trier les résultats (ex: -name pour un tri descendant). Tri par défaut : `-id` (plus récent en premier)."
          schema:
            type: string
            enum:
              - id
              - name
              - id_category
              - quantity
              - price
              - active
              - slug
              - virtual_product
              - salable
              - gift_card
              - gift_plan
              - disable_seo
              - ref
              - composable
              - created_at
              - updated_at
              - -id
              - -name
              - -id_category
              - -quantity
              - -price
              - -active
              - -slug
              - -virtual_product
              - -salable
              - -gift_card
              - -gift_plan
              - -disable_seo
              - -ref
              - -composable
              - -created_at
              - -updated_at
        - name: page
          in: query
          description: Numéro de la page pour la pagination
          schema:
            type: integer
        - name: per_page
          in: query
          description: Ignoré. La pagination est fixe à 20 éléments par page.
          schema:
            type: integer
      responses:
        200:
          description: Liste de produits récupérée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductEntity"
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        401:
          description: Authentification requise (jeton absent ou invalide)
        403:
          description: Accès interdit
        429:
          $ref: '#/components/responses/TooManyRequests'
    post:
      summary: Créer ou mettre à jour un produit
      description: |
        Crée le produit, ou le met à jour s'il existe déjà. Le produit est cherché par `external_id` s'il est fourni, sinon par `ref`.

        Deux formes de corps sont acceptées :
        - un produit seul (champs à la racine) : la réponse contient le produit dans `data`, avec le statut `201` s'il vient d'être créé et `200` s'il a été mis à jour ;
        - un lot `{"products": [...]}` : chaque élément suit le schéma d'un produit seul, la réponse contient la liste des produits dans `data` avec le statut `200`.

        À chaque enregistrement par cette route, le `slug` du produit est remplacé par un identifiant aléatoire (la valeur envoyée est ignorée) et `meta_title` reprend `name`.
        Si `description` est absente, un produit existant garde la sienne et un nouveau produit en reçoit une vide.
      tags:
        - products
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ProductEntityCreation"
                - type: object
                  description: Création ou mise à jour en lot
                  required:
                    - products
                  properties:
                    products:
                      type: array
                      items:
                        $ref: "#/components/schemas/ProductEntityCreation"
      responses:
        200:
          description: Produit mis à jour (corps unitaire), ou lot traité (corps `products`, `data` est alors une liste)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/ProductEntity"
                      - type: array
                        items:
                          $ref: "#/components/schemas/ProductEntity"
        201:
          description: Produit créé (corps unitaire uniquement)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProductEntity"
        422:
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        429:
          $ref: '#/components/responses/TooManyRequests'
  /products/{ref}:
    get:
      summary: Récupérer un produit par référence (SKU)
      tags:
        - products
      security:
        - bearerAuth: [ ]
      parameters:
        - name: ref
          in: path
          description: Référence du produit (SKU)
          required: true
          schema:
            type: string
      responses:
        200:
          description: Produit récupéré avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProductEntity"
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        404:
          description: Produit non trouvé
        429:
          $ref: '#/components/responses/TooManyRequests'
    patch:
      summary: Mettre à jour un produit par référence (SKU)
      description: |
        Met à jour le produit dont la référence est dans le chemin. Si `external_id` est fourni dans le corps, le produit est cherché par `external_id` et la référence du chemin est ignorée.
        `name`, `ref` et `price` sont obligatoires, même pour une mise à jour partielle.
      tags:
        - products
      security:
        - bearerAuth: [ ]
      parameters:
        - name: ref
          in: path
          description: Référence du produit (SKU)
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductEntityUpdate"
      responses:
        200:
          description: Produit mis à jour avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProductEntity"
        404:
          description: Produit non trouvé (par référence du chemin, ou par `external_id` s'il est fourni)
        422:
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        429:
          $ref: '#/components/responses/TooManyRequests'
  /webhooks:
    get:
      summary: Lister les derniers webhooks envoyés
      description: Renvoie les trois derniers webhooks envoyés pour cet évènement, du plus récent au plus ancien. Chaque élément est la charge utile (payload) envoyée. Un `event_type` absent ou inconnu répond 404.
      tags:
        - webhooks
      security:
        - bearerAuth: [ ]
      parameters:
        - name: event_type
          in: query
          description: Nom de l'évènement à avoir
          required: true
          schema:
            type: string
            enum:
              - created_subscription
              - updated_subscription
              - deleted_subscription
              - created_checkoutorder
              - updated_checkoutorder
              - created_checkouttransaction
              - updated_checkouttransaction
              - created_checkoutinvoice
              - created_address
              - updated_address
              - created_shippingbox
              - updated_shippingbox
              - deleted_shippingbox
              - created_user
              - updated_user
              - deleted_user
              - created_optin
              - updated_optin
      responses:
        200:
          description: Les trois derniers webhooks envoyés pour cet évènement (liste vide si aucun)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Charges utiles envoyées, de la plus récente à la plus ancienne
                    items:
                      type: object
                      additionalProperties: true
        404:
          description: Paramètre `event_type` absent ou nom d'évènement inconnu
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        429:
          $ref: '#/components/responses/TooManyRequests'
    post:
      summary: Ajouter un webhook
      description: |
        Enregistre l'adresse appelée pour un type d'évènement. Il n'y a qu'une adresse par type d'évènement : un nouvel enregistrement remplace l'adresse précédente pour ce type, y compris celle posée par le module PrestaShop.
        La réponse renvoie le site, enveloppé dans `data`, avec la liste des webhooks actifs.
      tags:
        - webhooks
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum:
                    - created_subscription
                    - updated_subscription
                    - deleted_subscription
                    - created_checkoutorder
                    - updated_checkoutorder
                    - created_checkouttransaction
                    - updated_checkouttransaction
                    - created_checkoutinvoice
                    - created_address
                    - updated_address
                    - created_shippingbox
                    - updated_shippingbox
                    - deleted_shippingbox
                    - created_user
                    - updated_user
                    - deleted_user
                    - created_optin
                    - updated_optin
                hook_url:
                  type: string
                  format: uri
                  description: URL http ou https publique, joignable depuis internet. Les adresses internes, privées ou réservées (localhost, 10.x, 192.168.x, 169.254.x...) sont refusées en 422.
              required:
                - hook_url
                - event_type
      responses:
        200:
          description: Webhook ajouté avec succès (site enveloppé dans `data`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteEntity"
        422:
          description: Erreur de validation (`event_type` inconnu, `hook_url` absente, mal formée ou non publique)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      summary: Supprimer un webhook
      description: Retire l'adresse enregistrée pour ce type d'évènement. La réponse renvoie le site, enveloppé dans `data`.
      tags:
        - webhooks
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum:
                    - created_subscription
                    - updated_subscription
                    - deleted_subscription
                    - created_checkoutorder
                    - updated_checkoutorder
                    - created_checkouttransaction
                    - updated_checkouttransaction
                    - created_checkoutinvoice
                    - created_address
                    - updated_address
                    - created_shippingbox
                    - updated_shippingbox
                    - deleted_shippingbox
                    - created_user
                    - updated_user
                    - deleted_user
                    - created_optin
                    - updated_optin
              required:
                - event_type
      responses:
        200:
          description: Webhook supprimé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteEntity"
        422:
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        429:
          $ref: '#/components/responses/TooManyRequests'
  /subscriptions/{id}:
    get:
      tags:
        - subscriptions
      security:
        - bearerAuth: [ ]
      summary: Obtenir les détails d'un abonnement
      parameters:
        - name: id
          in: path
          description: UUID de l'abonnement
          required: true
          schema:
            type: string
      responses:
        200:
          description: Réponse réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SubscriptionEntity'
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        404:
          description: Abonnement introuvable
        429:
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - subscriptions
      security:
        - bearerAuth: [ ]
      summary: Mettre à jour un abonnement
      description: |
        Permet de mettre à jour un abonnement, le résilier, le mettre en pause pour 1, 2 ou 3 mois, ou le relancer.
        L'adresse (`address_id`), le transporteur (`transporter`) et la déclinaison (`declinaison_id`) sont contrôlés avant toute écriture : une référence inconnue ou qui n'appartient pas au site répond 404 et l'abonnement n'est pas modifié.
        Les autres refus (422 sur `content` ou `next_billing`, par exemple) peuvent intervenir après l'application des changements qui les précèdent : n'envoyez qu'un changement par requête si vous avez besoin d'un résultat tout ou rien.
        La réponse renvoie l'abonnement relu après les modifications, enveloppé dans `data`.
      parameters:
        - name: id
          in: path
          description: UUID de l'abonnement à mettre à jour
          required: true
          schema:
            type: string
      requestBody:
        description: Données à modifier sur l'abonnement
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address_id:
                  type: integer
                  description: ID d'une adresse du site à affecter à l'abonnement (404 si elle n'appartient pas au site).
                declinaison_id:
                  type: integer
                  description: ID d'une déclinaison du site à affecter à l'abonnement (404 si elle n'appartient pas au site).
                transporter:
                  type: integer
                  description: ID d'un transporteur du site (404 s'il n'appartient pas au site). Peut être accompagné d'un objet `relay` décrivant le point relais choisi.
                relay:
                  type: object
                  additionalProperties: true
                  description: Point relais, lu uniquement avec `transporter`.
                voucher:
                  type: boolean
                  description: Si vrai, applique l'offre de rétention (bon de réduction) proposée au désabonnement.
                break:
                  type: boolean
                  description: Accepté par la validation, sans effet (la mise en pause passe par `pause` et `months`).
                months:
                  type: number
                  format: float
                  minimum: 1
                  maximum: 3
                  description: Nombre de mois pour mettre en pause l'abonnement (1, 2 ou 3 mois) (!= résiliation). Obligatoire si `pause` vaut true.
                active:
                  type: boolean
                  description: Indique si l'abonnement est actif.
                notification:
                  type: boolean
                  description: Lors de la résiliation d'un abonnement, notifier ou non par email.
                  default: true
                pause:
                  type: boolean
                  description: Indique si l'abonnement doit être mis en pause.
                next_billing:
                  type: string
                  format: date
                  description: Modifier la date du prochain paiement (date postérieure à aujourd'hui). Refusé en 422 si une commande du cycle est en attente avec une relance programmée.
                content:
                  type: array
                  description: nouveau contenu de l'abonnement, via external_id
                  items:
                    type: object
                    required:
                      - external_id
                      - quantity
                      - interval
                      - interval_count
                    properties:
                      external_id:
                        type: [string, integer]
                        maxLength: 255
                        description: Identifiant externe du produit, chaîne ou entier (255 caractères max). Les identifiants PrestaShop au format `produit:déclinaison` sont acceptés.
                      quantity:
                        type: integer
                        minimum: 1
                        description: Quantité du produit
                      interval:
                        type: string
                        description: Intervalle de renouvellement (`month`, `week` ou `day` attendus ; la valeur n'est pas contrôlée)
                      interval_count:
                        type: integer
                        minimum: 1
                        description: Nombre d'intervalles
                    example:
                      external_id: "123"
                      quantity: 1
                      interval: month
                      interval_count: 1
                interval:
                  type: string
                  description: Nouvel intervalle de renouvellement (`month`, `week` ou `day`), lu seulement avec `interval_count`.
                interval_count:
                  type: integer
                  description: Nouveau nombre d'intervalles, lu seulement avec `interval`.
                upsells:
                  type: array
                  description: Produits complémentaires (PrestaShop) enregistrés dans l'empreinte du panier de l'abonnement.
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      product_attribute_id:
                        type: integer
                      quantity:
                        type: integer
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 5000
                  description: |
                    Métadonnées personnalisées pour l'abonnement. Les valeurs doivent être des chaînes de caractères (max 5000 caractères).
                    Les clés commençant par "ciklik_encrypted_" seront automatiquement encryptées.
            example:
              active: true
              metadata:
                key1: "value1"
                key2: "value2"
                ciklik_encrypted_key2: "value-encrypted"

      responses:
        200:
          description: Succès - Abonnement mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SubscriptionEntity'

        401:
          description: Authentification requise (jeton absent ou invalide)
        403:
          description: Accès interdit
        404:
          description: Abonnement introuvable, ou adresse, transporteur ou déclinaison qui n'appartient pas au site.
        422:
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteSubscription
      tags:
        - subscriptions
      security:
        - bearerAuth: [ ]
      summary: Supprimer un abonnement
      description: >-
        Supprime un abonnement (soft delete). L'abonnement doit être inactif
        (active = false) et appartenir au tenant authentifié pour pouvoir être supprimé.
      parameters:
        - name: id
          in: path
          description: UUID de l'abonnement à supprimer.
          required: true
          schema:
            type: string
      responses:
        200:
          description: Succès - Abonnement supprimé.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
        401:
          description: Authentification requise (jeton absent ou invalide)
        403:
          description: Accès interdit
        404:
          description: Non trouvé - Abonnement introuvable ou n'appartenant pas au tenant authentifié.
        422:
          description: Erreur de validation - L'abonnement est encore actif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        429:
          $ref: '#/components/responses/TooManyRequests'
