              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Adresse e-mail de l'utilisateur
                  example: user@example.com
                external_id:
                  type: [string, integer, "null"]
                  maxLength: 255
                  description: Identifiant externe facultatif à enregistrer (chaîne ou entier, 255 caractères max), utilisé seulement à la création
                  example: some_external_id
              required:
                - email
      responses:
        200:
          description: Le client existait déjà sur le site, il est renvoyé tel quel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserSchema'
        201:
          description: Client créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserSchema'
        401:
          description: Authentification requise (jeton absent ou invalide)
        403:
          description: Accès interdit
        422:
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
