          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: updateDelivery
      summary: Mettre à jour un bon de livraison
      tags:
        - deliveries
      security:
        - bearerAuth: [ ]
      description: |
        Permet de le considérer comme expédié, et associer un numéro et un lien de suivi.
        Un `tracking_number` est enregistré sur le bon de livraison (et renvoyé dans `tracking_number`), le lien de suivi est construit à partir du transporteur et le statut passe à `shipped`.
        La réponse renvoie les lignes du bon relues après la mise à jour, dans une liste `data`.
      parameters:
        - name: id
          in: path
          description: UUID du bon de livraison (champ `uuid`, pas l'identifiant numérique `id`)
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking_number:
                  type: [string, "null"]
                  maxLength: 255
                  description: Numéro de suivi à associer au bon de livraison. Il est enregistré et renvoyé dans le champ `tracking_number`.
                notification:
                  type: boolean
                  default: false
                  description: Facultatif. Envoyer au client la notification d'expédition avec le lien de suivi (faux par défaut). Lu uniquement avec `tracking_number`.
                status:
                  type: [string, "null"]
                  description: Nouveau statut du BL
                  enum:
                    - created
                    - pending
                    - shipped
                    - delivered
                    - scheduled
                    - canceled
      responses:
        200:
          description: Succès - Bon de livraison mis à jour avec succès.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliverySchema'
        401:
          description: Authentification requise (jeton absent ou invalide)
        403:
          description: Accès interdit
        404:
          description: Aucun bon de livraison du site avec cet UUID
        422:
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteDelivery
      tags:
        - deliveries
      security:
        - bearerAuth: [ ]
      summary: Supprimer un élément d'un bon de livraison
      description: Supprime un élément du bon de livraison en utilisant son identifiant numérique `id` (et non l'UUID utilisé par GET et POST).
      parameters:
        - name: id
          in: path
          description: Identifiant numérique (`id`) de l'élément du bon de livraison à supprimer
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Succès
          content:
            application/json:
              example:
                data:
                  success: true
        403:
          description: Accès interdit
        401:
          description: Authentification requise (jeton absent ou invalide)
        404:
          description: Élément du bon de livraison non trouvé, ou appartenant à un autre site
        429:
          $ref: '#/components/responses/TooManyRequests'
