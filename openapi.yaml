    SubscriptionEntity:
      type: object
      properties:
        id:
          type: integer
          description: L'ID de l'abonnement.
        uuid:
          type: string
          description: UUID de l'abonnement.
        created_at:
          type: string
          format: date-time
          description: Date de création de l'abonnement.
        updated_at:
          type: string
          format: date-time
          description: Date de dernière mise à jour de l'abonnement.
        end_date:
          type: string
          format: date-time
          description: Date de fin de l'abonnement.
        engaged_date:
          type: string
          format: date-time
          description: Date d'engagement de l'abonnement.
        auto_pause_at:
          type: string
          format: date-time
          description: Date de mise en pause automatique de l'abonnement.
        start_date:
          type: string
          format: date-time
          description: Date de début de l'abonnement.
        active:
          type: boolean
          description: Indique si l'abonnement est actif.
        paused:
          type: boolean
          description: Indique si l'abonnement est en pause.
        next_billing:
          type: string
          format: date-time
          description: Date de la prochaine facturation de l'abonnement.
        update_transporter_at:
          type: string
          format: date-time
          description: Date de mise à jour du transporteur.
        relay:
          type: [object, 'null']
          additionalProperties: true
          description: Point relais associé à l'abonnement, null sans point relais.
        graceMonths:
          type: [integer, 'null']
          description: Nombre de mois de pause (période de grâce) de l'abonnement.
#        customerRevenue:
#          type: string
#          description: Revenu du client pour l'abonnement.
#        customerRefund:
#          type: string
#          description: Montant remboursé au client.
#        totalTransactionsSuccess:
#          type: integer
#          description: Nombre total de transactions réussies.
#        subTransactionsSuccess:
#          type: integer
#          description: Nombre de transactions réussies pour l'abonnement.
#        countTransactions:
#          type: integer
#          description: Nombre total de transactions.
#        customization_products:
#          type: array
#          description: Liste des produits de personnalisation associés à l'abonnement.
        retry_link:
          type: [string, 'null']
          description: >
            Lien de reprise de la dernière commande en attente de paiement de l'abonnement (renouvellement refusé),
            null s'il n'y a rien à régler. Le lien connecte le client à son compte : ne pas l'afficher ni le journaliser.
        pending_payment:
          type: [object, 'null']
          description: >
            Paiement en attente de l'abonnement : la dernière commande de renouvellement refusée, à régler par le lien
            de reprise. Null sans commande en attente ou sans lien de reprise.
          properties:
            order_id:
              type: integer
              description: Identifiant de la commande en attente.
            amount:
              type: number
              format: float
              description: Montant TTC à régler, celui que fait payer le lien de reprise.
            currency:
              type: [string, 'null']
              description: Code ISO 4217 de la devise, en majuscules (EUR).
            retry_link:
              type: string
              description: Lien de reprise de la commande, identique à retry_link.
            created_at:
              type: string
              format: date-time
              description: Date de création de la commande en attente.
            next_try:
              type: [string, 'null']
              format: date-time
              description: Date de la prochaine tentative de prélèvement automatique, null s'il n'y en a plus.
        interval:
          type: string
          description: Intervalle de facturation de l'abonnement.
        interval_count:
          type: integer
          description: Nombre d'intervalle pour la facturation de l'abonnement.
        switch_plan_uuid:
          type: string
          description: UUID du plan de changement.
        switch_plan_date:
          type: string
          format: date-time
          description: Date de changement de plan.
        referrer:
          type: string
          description: Source d'acquisition.
        address:
          $ref: "#/components/schemas/Address"
          description: Adresse de livraison de l'abonnement.
        user_uuid:
          type: string
          description: uuid de l'utilisateur.
        user_id:
          type: integer
          description: id de l'utilisateur.
        email:
          type: string
          description: email de l'utilisateur.
        display_interval:
          type: string
          description: Intervalle d'affichage de l'abonnement.
        display_content:
          type: string
          description: Contenu de l'abonnement sous forme de texte.
        external_fingerprint:
          type: string
          description: Emprinte de l'abonnement.
        content:
          type: array
          description: Contenu détaillé de l'abonnement.
          items:
            type: object
            properties:
              external_id:
                type: string
                description: Identifiant externe du produit, sans la partie personnalisation (ce qui précède le premier `_`).
              external_id_with_customizations:
                type: string
                description: Identifiant externe complet du produit, personnalisation comprise (identique à `external_id` pour un produit sans personnalisation).
              quantity:
                type: integer
                description: Quantité du produit.
              product_id:
                type: integer
                description: Identifiant du produit.
              subscription_id:
                type: integer
                description: Identifiant de l'abonnement.
              customizations:
                type: [array, object]
                description: Personnalisations du produit (tableau vide pour un produit sans personnalisation).
                items: {}
    OrderSchema:
      description: Schéma de données pour une commande
      type: object
      properties:
        order_id:
          description: ID de la commande
          type: integer
        user_id:
          description: ID de l'utilisateur
          type: integer
        user_uuid:
          description: UUID de l'utilisateur
          type: string
          format: uuid
        first_name:
          description: Prénom de l'utilisateur
          type: string
        last_name:
          description: Nom de l'utilisateur
          type: string
        phone:
          description: Numéro de téléphone de l'utilisateur
          type: string
        email:
          description: Adresse e-mail de l'utilisateur
          type: string
        status:
          description: Statut de la commande
          type: string
        created:
          description: Date de création de la commande
          type: string
          format: date-time
        items:
          description: Liste des articles de la commande
          type: array
          items:
            type: object
            properties:
              id:
                description: ID de l'article
                type: integer
              price:
                description: Prix HT de l'article, chaîne avec virgule décimale et deux décimales (ex. "12,50")
                type: string
                example: "12,50"
              tax:
                description: Taux de TVA applicable
                type: string
              quantity:
                description: Quantité de l'article commandée
                type: integer
              name:
                description: Nom de l'article
                type: string
              type:
                description: Type de l'article (par exemple, produit ou plan)
                type: string
              external_id:
                description: id du vendor connecté (id declinaison pour prestashop)
                type: string
              ref:
                description: Reference de l'article
                type: string

        shipping:
          description: Frais de livraison
          type: string
        count:
          description: Nombre total d'articles dans la commande
          type: integer
        total_tax_paid:
          description: Montant total des taxes payées, chaîne avec virgule décimale (ex. "2,08")
          type: string
          example: "2,08"
        total_discount_inc:
          description: Montant total de la remise incluse, chaîne avec virgule décimale (ex. "0,00")
          type: string
          example: "0,00"
        total_paid:
          description: Montant total payé, chaîne avec virgule décimale (ex. "12,50"), null si non renseigné
          type: [string, 'null']
          example: "12,50"
        total_shipping_paid:
          description: Frais de livraison totaux payés, chaîne avec virgule décimale (ex. "4,90")
          type: string
          example: "4,90"
        created_at:
          description: Date et heure de création de la commande
          type: string
          format: date-time
        coupon:
          description: Premier coupon appliqué à la commande (objet), ou tableau vide si aucun coupon
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              maxItems: 0
        subscription_uuid:
          description: UUID de l'abonnement associé (le cas échéant)
          type: string
        next_try:
          description: Prochaine tentative (le cas échéant)
          type: string
          format: date-time
        retry_link:
          description: "Lien de reprise du paiement de la commande, null s'il n'y en a pas. Le lien connecte le client à son compte : ne pas l'afficher ni le journaliser."
          type: [string, 'null']
        updated_at:
          description: Date et heure de dernière mise à jour de la commande
          type: string
          format: date-time
        paid_transaction_id:
          description: id transaction payée
          type: string
        paid_class_key:
          description: >-
            Moyen de paiement (clé de classe) de la transaction payée, par exemple `StripeCreditCard`, `PayPlugCreditCard`, `MollieCreditCard`, `PaypalVault`, `GoCardlessDirectDebit`.
          type: string
        prestashop_order_id:
          description: Correspondance commande PrestaShop
          type: [integer, 'null']
        prestashop_cart_id:
          description: Panier PrestaShop de la commande (tunnel ou renouvellement)
          type: [integer, 'null']
        payment_status:
          description: >-
            État du paiement. paid : une transaction est payée ; pending : paiement PayPal accepté mais pas encore
            encaissé (prélèvement bancaire), la commande est terminée sans être payée ; failed : dernière transaction en
            échec ; null : aucune transaction, ou renouvellement Mollie dont l'issue n'est pas encore confirmée (commande
            in_process, transaction au détail pending). Ne pas confondre avec pending_payment d'un abonnement (renouvellement
            refusé à régler).
          type: [string, 'null']
          enum: [paid, pending, failed, null]
        payment_class_key:
          description: >-
            Moyen de paiement (clé de classe) de la dernière transaction, payée ou non, par exemple
            `StripeCreditCard`, `PayPlugCreditCard`, `MollieCreditCard`, `PaypalVault`, `GoCardlessDirectDebit`.
          type: [string, 'null']
    UserSchema:
      type: object
      properties:
        id:
          type: integer
          description: ID de l'utilisateur.
        email:
          type: string
          format: email
          description: Adresse e-mail de l'utilisateur.
        uuid:
          type: string
          format: uuid
          description: UUID de l'utilisateur.
        refp:
          type: string
          description: Lien de parrainage de l'utilisateur.
        has_active_subscription:
          type: boolean
          description: Indique si l'utilisateur a un abonnement actif.
        info:
          type: [object, array, "null"]
          description: Informations complémentaires enregistrées sur l'utilisateur (commentaires), null si aucune.
        external_id:
          type: string
          description: ID externe de l'utilisateur.
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          description: Liste des adresses de l'utilisateur.
        customerRevenue:
          type: string
          description: Revenu du client (payé moins remboursé), chaîne formatée avec point décimal et virgule comme séparateur de milliers.
          example: "1,234.56"
        customerRefund:
          type: string
          description: Montant remboursé au client, chaîne formatée avec point décimal et virgule comme séparateur de milliers.
          example: "0.00"
        totalTransactionsSuccess:
          type: integer
          description: Total des transactions réussies.
    RebillErrorLogsSchema:
      type: object
      description: Schéma de données pour une erreur de rebill. Tous les champs sont toujours présents, mais certains peuvent être null selon le type d'erreur.
      properties:
        id:
          type: integer
          description: ID de l'erreur de rebill
        type:
          type: string
          description: Type d'erreur
          enum:
            - api
            - partial
            - failed
        created_at:
          type: string
          description: Date de création de l'erreur, au format `Y-m-d H:i:s` (ex. "2026-01-15 08:30:00"), sans fuseau horaire
          example: "2026-01-15 08:30:00"
        subscription_id:
          type: [string, 'null']
          description: UUID de l'abonnement (malgré le nom du champ, ce n'est pas l'identifiant numérique), null si l'erreur n'est rattachée à aucun abonnement
        order_id:
          type: [integer, 'null']
          description: ID de la commande Ciklik
        error_code:
          type: [integer, 'null']
          description: Code d'erreur
        error_message:
          type: [string, 'null']
          description: Message d'erreur
        status:
          type: [string, 'null']
          description: Statut de la commande
        subscription_url:
          type: [string, 'null']
          description: URL de l'abonnement dans l'interface d'administration
        order_url:
          type: [string, 'null']
          description: URL de la commande dans l'interface d'administration
        email:
          type: [string, 'null']
          description: Email du client
        phone:
          type: [string, 'null']
          description: Téléphone du client
        address:
          type: [string, 'null']
          description: Adresse du client
        address1:
          type: [string, 'null']
          description: Complément d'adresse du client
        postcode:
          type: [string, 'null']
          description: Code postal du client
        city:
          type: [string, 'null']
          description: Ville du client
        country:
          type: [string, 'null']
          description: Pays du client
        first_name:
          type: [string, 'null']
          description: Prénom du client
        last_name:
          type: [string, 'null']
          description: Nom du client
