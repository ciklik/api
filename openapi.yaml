components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Jeton d'API Ciklik (jeton opaque, pas un JWT), envoyé dans l'en-tête `Authorization: Bearer <jeton>`."
  headers:
    X-RateLimit-Limit:
      description: Nombre maximum de requêtes autorisées par minute et par adresse IP.
      schema:
        type: integer
        example: 200
    X-RateLimit-Remaining:
      description: Nombre de requêtes restantes dans la fenêtre courante.
      schema:
        type: integer
        example: 195
    Retry-After:
      description: Nombre de secondes avant la réinitialisation de la fenêtre de rate limiting.
      schema:
        type: integer
        example: 60
  responses:
    TooManyRequests:
      description: Limite de débit atteinte (200 requêtes par minute, comptées par adresse IP).
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        text/plain:
          schema:
            type: string
            example: "Too many requests"
  schemas:
    TransactionSchema:
      type: object
      properties:
        order_id:
          type: integer
          description: L'identifiant de la commande.
        order:
          $ref: '#/components/schemas/TransactionOrderSchema'
        gateway:
          type: string
          description: >-
            Moyen de paiement de la transaction (clé de classe), par exemple `StripeCreditCard`, `PayPlugCreditCard`, `MollieCreditCard`, `PaypalVault`, `GoCardlessDirectDebit`.
          example: "MollieCreditCard"
        transaction_id:
          type: string
          description: >-
            L'identifiant de la transaction chez la passerelle. Pour Mollie, l'identifiant du paiement (`tr_...`).
        detail:
          type: string
          description: >-
            Détails de la transaction. Valeurs propres à Mollie : `pending` (renouvellement dont Mollie n'a pas encore
            confirmé l'issue, la commande est alors `in_process`) et `replaced` (tentative en cours reprise par un
            prélèvement suivant, qui porte le même paiement).
        token:
          type: string
          description: Le jeton de la transaction.
        tenant_id:
          type: integer
          description: L'identifiant du locataire.
        paid:
          type: boolean
          description: Indique si la transaction a été payée.
        amount:
          type: string
          description: Le montant de la transaction.
        refunded:
          type: boolean
          description: Indique si la transaction a été remboursée.
        source_id:
          type: string
          description: >-
            L'identifiant de la source (moyen de paiement débité). Pour Mollie, en général le mandat de la carte
            enregistrée (`mdt_...`).
        failure_message:
          type: string
          description: Message d'échec de la transaction.
        failure_code:
          type: string
          description: >-
            Code d'échec de la transaction. Pour Mollie : le motif de refus donné par Mollie, ou un code posé par
            Ciklik quand la requête de prélèvement est refusée (`mandate_revoked` : carte retirée ou mandat révoqué,
            `merchant_forbidden` : clé API du site refusée par Mollie, `forbidden` : requête refusée,
            `payment_method_missing` : aucun client Mollie enregistré).
        invoice_id:
          type: integer
          description: L'identifiant de la facture associée à la transaction.
        amount_refunded:
          type: string
          description: Montant remboursé de la transaction.
        statement_descriptor:
          type: string
          description: Description de l'état de compte.
        user_id:
          type: integer
          description: L'identifiant de l'utilisateur associé à la transaction.
        created_at:
          type: string
          format: date-time
          description: Date et heure de création de la transaction.
        updated_at:
          type: string
          format: date-time
          description: Date et heure de mise à jour de la transaction.
        payment_intent_id:
          type: string
          description: >-
            L'identifiant de l'intention de paiement associée à la transaction. Pour Mollie, l'identifiant du paiement
            (`tr_...`).
    TransactionOrderSchema:
      type: object
      description: >
        Commande détaillée de la transaction. Elle diffère de la commande renvoyée par /orders : mêmes champs de base
        (order_id, user_id, user_uuid, first_name, last_name, phone, email, status, created, items, shipping, count,
        total_tax_paid, total_discount_inc, total_paid, total_shipping_paid, created_at, coupon, subscription_uuid,
        retry_link, paid_transaction_id, paid_class_key, prestashop_order_id), sans `updated_at`, avec des articles
        au format interne et des statistiques client et abonnement en plus.
      additionalProperties: true
      properties:
        order_id:
          type: integer
          description: ID de la commande
        status:
          type: string
          description: Statut de la commande
        items:
          type: array
          description: Articles de la commande
          items:
            type: object
            additionalProperties: true
        revenue:
          type: [string, 'null']
          description: Revenu de l'abonnement (payé moins remboursé), chaîne formatée, null hors abonnement
        refunded:
          type: [string, 'null']
          description: Montant remboursé sur l'abonnement, chaîne formatée, null hors abonnement
        customerRevenue:
          type: string
          description: Revenu du client (payé moins remboursé), chaîne formatée avec séparateur de milliers
        customerRefund:
          type: string
          description: Montant remboursé au client, chaîne formatée avec séparateur de milliers
        totalTransactionsSuccess:
          type: integer
          description: Nombre de transactions réussies du client
        subTransactionsSuccess:
          type: [integer, 'null']
          description: Nombre de transactions payées sur l'abonnement
        next_billing:
          type: [string, 'null']
          format: date-time
          description: Prochaine échéance de l'abonnement lié
        countTransactions:
          type: integer
          description: Nombre de transactions de la commande
        choices:
          description: Choix de l'abonnement lié, null hors abonnement
