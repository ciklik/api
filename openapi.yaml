            - App\Product
            - App\AddonPlan
            - App\Plan
        order_id:
          type: integer
          description: ID de la commande associée.
        ref:
          type: string
          description: Référence du produit dans le BL au moment de la commande.
        customization_products:
          type: array
          description: >
            Composition de base de la box, issue de la sélection de personnalisation de l'abonnement.
            Chaque entrée est une ligne produit identifiée par son customizationId.
          items:
            type: object
            properties:
              customizationId:
                type: integer
                description: Identifiant unique de la ligne de personnalisation (clé de rapprochement avec extra_customization_products).
              productId:
                type: integer
                description: ID du produit.
              quantity:
                type: integer
                description: Quantité de base de la ligne.
              ref:
                type: string
                description: Référence du produit.
        extra_customization_products:
          type: array
          description: >
            Surcharges propres à ce bon de livraison (modifications manuelles de la box).
            IMPORTANT : chaque entrée est un OVERRIDE ABSOLU par customizationId, pas un delta.
            Quand une ligne figure ici, sa quantity REMPLACE celle de customization_products pour le
            même customizationId ; elle ne s'y ajoute jamais. Les lignes absentes de ce tableau
            conservent la quantité de customization_products. La composition finale se calcule donc en
            partant de customization_products, puis en remplaçant chaque customizationId présent dans
            extra_customization_products (ou en l'ajoutant s'il n'existe pas en base). Ne jamais
            additionner les deux tableaux.
          items:
            type: object
            properties:
              customizationId:
                type: integer
                description: Identifiant de la ligne de personnalisation surchargée (matche un customizationId de customization_products pour un remplacement, ou en ajoute un nouveau).
              productId:
                type: integer
                description: ID du produit.
              quantity:
                type: integer
                description: Quantité finale absolue de la ligne (remplace la quantité de base).
              ref:
                type: string
                description: Référence du produit.
