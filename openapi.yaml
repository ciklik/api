          type: integer
        quantity:
          type: integer
        price:
          type: number
        tax:
          type: number
          enum:
            - 0
            - 0.2
            - 0.055
            - 0.1
            - 0.021
            - 0.21
            - 0.06
        active:
          type: boolean
        virtual_product:
          type: boolean
        frequencies:
          type: array
          items:
            type: object
            required:
              - interval
              - interval_count
            properties:
              interval:
                type: string
                enum:
                  - month
                  - week
                  - day
              interval_count:
                type: integer
                minimum: 1
                maximum: 28
      required:
        - name
        - ref
        - price
      example:
        ref: "REFABOPRODUIT"
        name: "Super nom produit"
        price: "17.50"
        description: "Petite description produit"
        tax: "0.2"
        frequencies:
          - interval: "month"
            interval_count: 2
