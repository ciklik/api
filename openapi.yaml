          description: Authentification requise (jeton absent ou invalide)
        403:
          description: Accès interdit
        404:
          description: La ressource n'a pas été trouvée
        429:
          $ref: '#/components/responses/TooManyRequests'
    put:
      summary: Demander le remboursement d'une transaction par ID
      description: |
        Rembourse tout ou partie d'une transaction payée. La réponse renvoie la transaction, enveloppée dans `data`.
        Un remboursement refusé (transaction échouée, montant supérieur au restant, solde insuffisant, refus de Stripe) répond 422 avec le motif dans `errors.error`. Un refus d'une autre passerelle peut répondre 500.
      tags:
        - transactions
      security:
        - bearerAuth: [ ]
      parameters:
          - name: transaction_id
            in: path
            required: true
            description: L'identifiant de la transaction à rembourser.
            schema:
              type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  minimum: 0.01
                  description: Le montant à rembourser (numérique, minimum 0.01).
      responses:
        200:
          description: Réponse réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TransactionSchema'
        401:
          description: Authentification requise (jeton absent ou invalide)
        403:
          description: Accès interdit
        404:
          description: La ressource n'a pas été trouvée
        422:
          description: Erreur de validation du montant (`errors.amount`), ou remboursement refusé (motif dans `errors.error`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: Vous ne pouvez pas rembourser une transaction échouée.
                errors:
                  error:
                    - Vous ne pouvez pas rembourser une transaction échouée.
        429:
          $ref: '#/components/responses/TooManyRequests'
